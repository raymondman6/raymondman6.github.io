<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121816" media="(prefers-color-scheme: dark)">
<title>升学问答 · DSE 2027</title>
<style>
:root{
  --bg:#eef2ef; --paper:#fbfcfa; --ink:#1d2a27; --ink2:#51605b; --mute:#93a09b;
  --line:#d5ddd8; --sage:#4f7f6f; --sage-soft:#dfeae4; --apricot:#e9a24f; --apricot-soft:#fbecd8;
  --rose:#c4636f; --rose-soft:#f6e1e3; --sky:#5b7fa6; --sky-soft:#e1e9f2;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","Noto Serif CJK SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:999px;
  --shadow:0 1px 0 rgba(29,42,39,.04),0 12px 28px -18px rgba(29,42,39,.28);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121816; --paper:#1a2220; --ink:#e7eeea; --ink2:#a9b7b1; --mute:#82908b;
  --line:#2c3834; --sage:#8cc0ad; --sage-soft:#22332d; --apricot:#f0b46a; --apricot-soft:#3a2d1c;
  --rose:#e48d97; --rose-soft:#3a2428; --sky:#93b4d8; --sky-soft:#1f2b38;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -20px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans);letter-spacing:.01em;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
a{color:var(--sage);text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--apricot);outline-offset:3px;border-radius:8px}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}

.back{display:inline-flex;align-items:center;gap:6px;margin:22px 0 28px;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none}
.back:hover{color:var(--sage)}
.back svg{width:16px;height:16px;flex:none}

header.hero{padding:0 0 8px}
.kicker{font-size:14px;color:var(--ink2);margin:0 0 8px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(36px,9vw,52px);line-height:1.15;margin:0;letter-spacing:.02em}
h1 small{display:block;font-size:.38em;font-weight:500;color:var(--ink2);letter-spacing:.04em;margin-top:10px;font-family:var(--sans)}
.lede{margin:18px 0 0;color:var(--ink2);font-size:15.5px;line-height:1.75;max-width:36em}

.btn{white-space:nowrap;border:0;border-radius:var(--r-sm);padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sage);color:var(--paper)}
.btn svg{width:18px;height:18px}

.qa-cta{margin:28px 0 40px}
.qa-cta .cta-note{margin:12px 0 0;font-size:13px;color:var(--mute)}

.qa-hist>h2{font-family:var(--serif);font-size:24px;margin:0 0 6px;font-weight:700}
.qa-hist .hist-sub{margin:0 0 18px;color:var(--ink2);font-size:14.5px}
.qa-list{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.qa-card{background:var(--paper);border-radius:var(--r-md);box-shadow:var(--shadow);padding:18px 18px 16px;position:relative}
.qa-card.sample{box-shadow:inset 3px 0 0 var(--sky),var(--shadow)}
.qa-card .card-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:10px}
.qa-card .qdate{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tag{border-radius:6px;padding:1px 8px;font-weight:600;font-size:12.5px}
.s-ok{background:var(--sage-soft);color:var(--sage)}
.s-wait{background:var(--apricot-soft);color:color-mix(in srgb,var(--apricot) 70%,var(--ink))}
.s-sample{background:var(--sky-soft);color:var(--sky)}
.qa-q{font-size:16.5px;font-weight:600;line-height:1.55;margin:0;color:var(--ink)}
.qa-q::before{content:"问";display:inline-block;font-size:11.5px;font-weight:700;color:var(--sage);background:var(--sage-soft);border-radius:5px;padding:0 6px;margin-right:8px;vertical-align:2px;letter-spacing:.04em}
.qa-a{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--sage-soft) 70%,var(--paper));font-size:15px;line-height:1.75;color:var(--ink)}
.qa-a::before{content:"答";display:inline-block;font-size:11.5px;font-weight:700;color:var(--paper);background:var(--sage);border-radius:5px;padding:0 6px;margin-right:8px;vertical-align:2px;letter-spacing:.04em}
.qa-a.empty{background:transparent;padding:8px 0 0;color:var(--mute);font-size:14px}
.qa-a.empty::before{display:none}
.qa-empty{text-align:center;padding:36px 20px;color:var(--ink2);background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.qa-empty .ico{font-family:var(--serif);font-size:36px;color:var(--sage);margin-bottom:8px;line-height:1}
.qa-empty p{margin:0;font-size:15px;line-height:1.7}
.qa-empty p+p{margin-top:6px;font-size:13.5px;color:var(--mute)}
.qa-err{margin:0 0 14px;padding:16px 18px;border-radius:var(--r-md);background:var(--apricot-soft);color:color-mix(in srgb,var(--apricot) 55%,var(--ink));font-size:14.5px;line-height:1.65}

footer{color:var(--mute);font-size:13px;padding:48px 0 56px;text-align:center;line-height:1.7}
footer .upd{margin-top:10px;display:block}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    返回升学任务线
  </a>

  <header class="hero">
    <p class="kicker">给 Form 6 的你 · 有疑问随时问</p>
    <h1>升学问答<small>Admissions &amp; exam Q&amp;A</small></h1>
    <p class="lede">升学、考试、志愿填报有不清楚的地方，写下来就好。顾问会尽快回复；问答记录会出现在下方，方便你之后回来看。</p>
  </header>

  <div class="qa-cta">
    <a class="btn primary" href="https://docs.google.com/forms/d/e/1FAIpQLSdCFAmWVLheIMIOaYdtSFhTlYpbgGW8ORLkuYVIRZX1puULGg/viewform" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      写下问题
    </a>
    <p class="cta-note">会打开 Google 表单，填好提交即可。不用登录。</p>
  </div>

  <div class="qa-hist">
    <h2>问答记录</h2>
    <p class="hist-sub">按提问时间从新到旧排列。</p>
    <div id="qa-status" hidden></div>
    <ul class="qa-list" id="qa-list" aria-live="polite"></ul>
  </div>

  <footer>
    回答由升学顾问提供，仅供参考；请以考评局与 JUPAS 最新公布为准。
    <span class="upd">最后更新：<span id="qa-upd">—</span>（香港时间）</span>
  </footer>
</div>

<script>
(function(){
  const FORM='https://docs.google.com/forms/d/e/1FAIpQLSdCFAmWVLheIMIOaYdtSFhTlYpbgGW8ORLkuYVIRZX1puULGg/viewform';
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function fmtDate(iso){
    if(!iso)return '';
    const d=new Date(iso);
    if(Number.isNaN(d.getTime()))return esc(String(iso).slice(0,10));
    const parts=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'numeric',day:'numeric',weekday:'short'}).formatToParts(d);
    const g=t=>parts.find(p=>p.type===t)?.value||'';
    return `${g('year')}年${g('month')}月${g('day')}日 · 周${(g('weekday')||'').replace('周','')}`;
  }
  function card(it){
    const answered=it.status==='answered'&&it.answer;
    const sample=it.sample||it.id==='sample-1'||(it.question||'').includes('（示例）');
    const badge=answered
      ?'<span class="tag s-ok">已回复</span>'
      :'<span class="tag s-wait">待回复</span>';
    const samp=sample?'<span class="tag s-sample">示例</span>':'';
    const ans=answered
      ?`<div class="qa-a">${esc(it.answer)}</div>`
      :`<div class="qa-a empty">顾问还在准备回复，请稍后再来看。</div>`;
    return `<li class="qa-card${sample?' sample':''}">
      <div class="card-top"><span class="qdate">${fmtDate(it.askedAt)}</span>${badge}${samp}</div>
      <p class="qa-q">${esc(it.question)}</p>
      ${ans}
    </li>`;
  }
  function emptyState(){
    return `<li class="qa-empty">
      <div class="ico">问</div>
      <p>还没有问答记录。</p>
      <p>你写下问题、我们回复之后，就会出现在这里。</p>
    </li>`;
  }
  function showErr(msg){
    const el=document.getElementById('qa-status');
    el.hidden=false;
    el.className='qa-err';
    el.innerHTML=msg;
  }
  async function load(){
    const list=document.getElementById('qa-list');
    try{
      const res=await fetch('./qa-data.json',{cache:'no-store'});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const data=await res.json();
      document.getElementById('qa-upd').textContent=data.updated||'—';
      const items=Array.isArray(data.items)?[...data.items]:[];
      items.sort((a,b)=>String(b.askedAt||'').localeCompare(String(a.askedAt||'')));
      if(!items.length){list.innerHTML=emptyState();return}
      list.innerHTML=items.map(card).join('');
    }catch(e){
      list.innerHTML='';
      showErr('暂时无法载入问答记录。请从网站打开本页；本地直接打开文件时浏览器会拦截资料载入。<br><a href="'+FORM+'" target="_blank" rel="noopener">仍可先去写下问题 →</a>');
      document.getElementById('qa-upd').textContent='—';
    }
  }
  load();
})();
</script>
</body>
</html>
